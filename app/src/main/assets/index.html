<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1f6feb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>逐行复制助手</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --accent:#1f6feb; --accent2:#2ea043;
    --text:#e6edf3; --muted:#8b949e; --line:#30363d; --danger:#f85149;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; min-height:100%;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
  }
  header{padding:16px 4px 8px; text-align:center;}
  header h1{font-size:20px; margin:0; letter-spacing:1px;}
  header p{color:var(--muted); font-size:13px; margin:6px 0 0;}

  .progress-wrap{padding:10px 4px 4px;}
  .progress-bar{height:8px; background:var(--line); border-radius:99px; overflow:hidden;}
  .progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#58a6ff); transition:width .25s ease;}
  .progress-text{display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-top:6px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:18px; margin-top:14px; flex:1; display:flex; flex-direction:column;
  }
  .current-label{color:var(--muted); font-size:13px; text-align:center;}
  .current-number{
    flex:1; display:flex; align-items:center; justify-content:center;
    text-align:center; word-break:break-all; font-size:clamp(22px,7vw,40px);
    font-weight:600; line-height:1.3; padding:14px 6px; letter-spacing:.5px;
    user-select:text;
  }
  .hint{color:var(--muted); font-size:12px; text-align:center; min-height:18px; margin-top:4px;}

  .actions{display:flex; gap:10px; margin-top:14px;}
  button{
    flex:1; border:none; border-radius:12px; padding:16px;
    font-size:16px; font-weight:600; color:#fff; cursor:pointer;
    transition:transform .05s ease, opacity .2s;
  }
  button:active{transform:scale(.97);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .btn-copy{background:var(--accent2);}
  .btn-skip{background:var(--line); color:var(--text);}
  .btn-prev{background:var(--line); color:var(--text);}

  .import-zone{
    border:2px dashed var(--line); border-radius:16px; padding:30px 16px;
    text-align:center; color:var(--muted); cursor:pointer; margin-top:6px;
  }
  .import-zone b{color:var(--text);}
  textarea{
    width:100%; margin-top:12px; background:var(--bg); color:var(--text);
    border:1px solid var(--line); border-radius:12px; padding:12px;
    font-size:14px; min-height:120px; resize:vertical; font-family:inherit;
  }
  .row{display:flex; gap:10px; margin-top:12px;}
  .row button{background:var(--accent);}
  .ghost{background:transparent!important; color:var(--muted)!important; border:1px solid var(--line)!important;}
  .hidden{display:none!important;}
  .done{text-align:center; color:var(--accent2); font-size:18px; padding:20px 0;}
  .toast{
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
    background:#000; color:#fff; padding:10px 18px; border-radius:99px;
    font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:9;
  }
  .toast.show{opacity:.92;}
  footer{text-align:center; color:var(--muted); font-size:11px; padding:10px 0 2px;}
</style>
</head>
<body>

<header>
  <h1>逐行复制助手</h1>
  <p>导入数字文本，逐行复制并自动翻页</p>
</header>

<section id="importView" class="card">
  <div class="import-zone" id="fileZone">
    📂 点击选择文本文件（.txt）<br><br>
    <b>每行一组数字</b>，可有很多行
  </div>
  <input type="file" id="fileInput" accept=".txt,text/plain" class="hidden" />

  <div style="text-align:center;color:var(--muted);font-size:12px;margin-top:14px;">— 或手动粘贴 —</div>
  <textarea id="pasteArea" placeholder="把数字粘贴到这里，每行一组&#10;例如：&#10;13800138000&#10;13800138001&#10;13800138002"></textarea>
  <div class="row">
    <button id="loadPaste">从这里开始</button>
    <button class="ghost" id="clearPaste">清空</button>
  </div>
</section>

<section id="copyView" class="hidden" style="flex:1; display:flex; flex-direction:column;">
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text">
      <span id="progressCount">第 0 / 0 行</span>
      <span id="remaining">剩余 0</span>
    </div>
  </div>

  <div class="card">
    <div class="current-label">当前数字</div>
    <div class="current-number" id="currentNumber">—</div>
    <div class="hint" id="hint">点击「复制」即可复制并翻到下一行</div>

    <div class="actions">
      <button class="btn-prev" id="btnPrev">← 上一条</button>
      <button class="btn-skip" id="btnSkip">跳过</button>
    </div>
    <div class="actions">
      <button class="btn-copy" id="btnCopy">📋 复制</button>
    </div>
    <div class="row">
      <button class="ghost" id="btnRestart">重新导入</button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<footer>数据仅保存在本机，不会上传</footer>

<script>
  const $ = (id)=>document.getElementById(id);
  let lines = [];
  let index = 0;

  function parseText(text){
    return text
      .split(/\r?\n/)
      .map(l => l.trim())
      .filter(l => l.length > 0);
  }

  function startCopy(parsed){
    if(parsed.length === 0){ showToast('没有可用数据'); return; }
    lines = parsed;
    index = 0;
    $('importView').classList.add('hidden');
    $('copyView').classList.remove('hidden');
    render();
  }

  function render(){
    if(index >= lines.length){
      showDone();
      return;
    }
    $('currentNumber').textContent = lines[index];
    const total = lines.length;
    $('progressCount').textContent = `第 ${index+1} / ${total} 行`;
    $('remaining').textContent = `剩余 ${total - index - 1}`;
    $('progressFill').style.width = ((index)/total*100) + '%';
    $('btnPrev').disabled = (index === 0);
  }

  function showDone(){
    $('progressFill').style.width = '100%';
    $('progressCount').textContent = `已完成 ${lines.length} / ${lines.length} 行`;
    $('remaining').textContent = '全部完成 🎉';
    const box = $('currentNumber');
    box.innerHTML = '<div class="done">✅ 全部复制完成！</div>';
    $('hint').textContent = '可以重新导入，或退出';
    $('btnCopy').disabled = true;
    $('btnSkip').disabled = true;
    $('btnPrev').disabled = false;
  }

  // 复制：优先走 App 原生剪贴板接口（AndroidBridge），兜底用网页方案
  function copyText(text){
    try{
      if(window.AndroidBridge && window.AndroidBridge.copy){
        window.AndroidBridge.copy(text);
        return true;
      }
    }catch(e){}
    try{
      if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(text);
        return true;
      }
    }catch(e){}
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position='fixed'; ta.style.top='-9999px'; ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }

  async function doCopy(){
    if(index >= lines.length) return;
    const text = lines[index];
    const ok = copyText(text);
    if(ok){
      showToast('已复制：' + text);
      index++;
      setTimeout(render, 350);
    }else{
      showToast('复制失败，请长按数字手动复制');
    }
  }

  function doSkip(){
    if(index >= lines.length) return;
    index++;
    render();
  }
  function doPrev(){
    if(index === 0) return;
    index--;
    $('btnCopy').disabled = false;
    $('btnSkip').disabled = false;
    render();
  }

  let toastTimer;
  function showToast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 1500);
  }

  $('fileZone').addEventListener('click', ()=> $('fileInput').click());
  $('fileInput').addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = (ev)=> startCopy(parseText(ev.target.result));
    reader.readAsText(f, 'UTF-8');
  });

  $('loadPaste').addEventListener('click', ()=>{
    startCopy(parseText($('pasteArea').value));
  });
  $('clearPaste').addEventListener('click', ()=> $('pasteArea').value='');

  $('btnCopy').addEventListener('click', doCopy);
  $('btnSkip').addEventListener('click', doSkip);
  $('btnPrev').addEventListener('click', doPrev);
  $('btnRestart').addEventListener('click', ()=>{
    $('copyView').classList.add('hidden');
    $('importView').classList.remove('hidden');
    $('btnCopy').disabled = false;
    $('btnSkip').disabled = false;
    $('pasteArea').value='';
    $('fileInput').value='';
  });

  $('currentNumber').addEventListener('click', ()=>{
    if(index < lines.length && !$('btnCopy').disabled){
      const ok = copyText(lines[index]);
      showToast(ok ? ('已复制：'+lines[index]) : '请长按选中后复制');
    }
  });
</script>
</body>
</html>
